# nginx sends no Cache-Control by default. Proxied through Cloudflare, that
# gap lets its default edge-caching heuristics apply to static extensions
# like .js and .css, independent of the browser's own cache — which is how a
# deploy can ship a new index.html next to a stale, previously-cached app.js.
# The two then disagree about which elements exist, and features silently
# stop working with no error anywhere.
#
# This app is low-traffic and changes often enough that correctness matters
# more than shaving a request: no-cache forces a conditional GET (an ETag
# round-trip, not a full re-download) before serving anything from any cache
# layer, so every load gets the version that was actually deployed.
add_header Cache-Control "no-cache" always;
